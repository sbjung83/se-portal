# SE Portal — nginx(80/443) → uvicorn(127.0.0.1:8000)
# 인증서는 install.sh 가 자체 서명으로 만든다 (/etc/pki/nginx/se-portal.crt, private/se-portal.key)

# HTTP 로 들어오면 HTTPS 로 넘긴다
server {
    listen 80;
    server_name 192.168.x.x;  # 실제 서버 IP로 변경
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 192.168.x.x;  # 실제 서버 IP로 변경

    ssl_certificate     /etc/pki/nginx/se-portal.crt;
    ssl_certificate_key /etc/pki/nginx/private/se-portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # 점검표·제출자료 업로드 크기 제한 (50MB)
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
